<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173e35" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ledger_theme')
          var theme = stored === 'dark' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1512' : '#173e35')
        } catch (error) { /* Keep the light default if storage is unavailable. */ }
      })()
    </script>
    <meta name="description" content="Track stock, sales and expenses in one place. Stock Ledger keeps your inventory and shop analytics in order." />
